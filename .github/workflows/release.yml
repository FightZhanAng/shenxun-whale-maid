name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run make:win
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist-upload
          cp release/*.exe "dist-upload/shenxun-whale-maid-${version}-x64-Setup.exe"
          sed "s|\${GITHUB_REF_NAME}|${GITHUB_REF_NAME}|g" .github/release-notes.md > dist-upload/notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --yes --cleanup-tag=false
          fi
          gh release create "${GITHUB_REF_NAME}" dist-upload/*.exe \
            --title "深寻鲸娘 ${GITHUB_REF_NAME}" \
            --notes-file dist-upload/notes.md
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'
