name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Validate development contract and spec
        run: |
          node tools/validate-dev-contract.mjs
          node tools/validate-spec.mjs
          node tools/validate-asset-links.mjs
      - name: Unit tests
        run: npm test

